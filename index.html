<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>CityCast | Dashboard</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <!-- DaisyUI + Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'fade-in': 'fadeIn 0.5s ease-in-out',
            'slide-up': 'slideUp 0.5s ease-out',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .card-glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .weather-card {
      transition: all 0.3s ease;
    }

    .weather-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .search-input {
      transition: all 0.3s ease;
    }

    .search-input:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
    }

    .unit-toggle.active {
      background: white !important;
      color: #6b21a8 !important;
      font-weight: 600;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col md:flex-row">


  <!-- Main Content -->
  <main class="flex-1 p-6 bg-gradient-to-b from-purple-700 to-purple-900 overflow-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row items-center justify-between mb-6">
      <div class="flex items-center gap-3 mb-6">
  <!-- Weather Icon -->
  <img 
    class="w-12 h-12 md:w-16 md:h-16 opacity-90" 
    loading="lazy" 
    src="https://cdn-icons-png.flaticon.com/512/1163/1163624.png" 
    alt="CityCast weather logo">

  <!-- Project Name -->
  <h2 class="text-3xl font-semibold text-white">CityCast</h2>
</div>

      
      <!-- Search & Units -->
      <div class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
        <div class="flex gap-2">
          <div class="relative flex-1">
            <input id="input"
              class="search-input w-full bg-white/10 text-white placeholder-white/70 py-3 pl-12 pr-5 rounded-2xl border-none outline-none"
              type="text" placeholder="Enter city name..." spellcheck="false">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-white/70"></i>
          </div>
          <button id="btn"
            class="bg-white/20 hover:bg-white/30 text-white p-3 rounded-2xl transition-all duration-300 transform hover:scale-105"
            title="Use my location"> <i class="fa-solid fa-location-crosshairs"></i> </button>
        </div>

        <div class="bg-white/10 rounded-full p-1 flex">
          <button id="celsiusBtn" class="unit-toggle active px-4 py-2 rounded-full">°C</button>
          <button id="fahrenheitBtn" class="unit-toggle px-4 py-2 text-white rounded-full">°F</button>
        </div>
      </div>
    </header>

    <!-- No Data State -->
    <div id="noData" class="card-glass p-8 text-center animate-fade-in mb-6">
      <div class="flex justify-center mb-6">
        <img class="w-32 md:w-40 opacity-80" loading="lazy" src="https://cdn-icons-png.flaticon.com/512/61/61088.png"
          alt="Search weather illustration">
      </div>
      <h2 class="text-2xl font-semibold text-white mb-2">Search for Weather</h2>
      <p class="text-white/70">Enter a city name to get current weather information</p>
    </div>

    <!-- Weather Display -->
    <div id="weatherContainer" class="hidden">
      <!-- Current Weather -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div class="card-glass p-6 weather-card flex flex-col items-center text-center animate-slide-up">
          <h2 id="city" class="text-2xl font-semibold text-white mb-2">--</h2>
          <p id="date" class="text-white/70 mb-4">--</p>
          <img id="weatherIcon" class="w-32 h-32 mb-4" src="./images/clouds.png" alt="Weather condition" loading="lazy">
          <h1 id="temp" class="text-5xl font-bold text-white mb-2">--</h1>
          <p id="description" class="text-white/70 text-xl capitalize">--</p>
        </div>

        <div class="card-glass p-6 grid grid-cols-2 gap-4 weather-card animate-slide-up">
          <div class="bg-white/10 rounded-2xl p-4 text-center">
            <i class="fa-solid fa-wind text-white/70 text-xl mb-2"></i>
            <p class="text-white/70">Wind Speed</p>
            <p id="wind" class="text-white text-xl font-semibold">-- km/h</p>
          </div>
          <div class="bg-white/10 rounded-2xl p-4 text-center">
            <i class="fa-solid fa-droplet text-white/70 text-xl mb-2"></i>
            <p class="text-white/70">Humidity</p>
            <p id="humidity" class="text-white text-xl font-semibold">--%</p>
          </div>
          <div class="bg-white/10 rounded-2xl p-4 text-center">
            <i class="fa-solid fa-gauge-high text-white/70 text-xl mb-2"></i>
            <p class="text-white/70">Pressure</p>
            <p id="pressure" class="text-white text-xl font-semibold">-- hPa</p>
          </div>
          <div class="bg-white/10 rounded-2xl p-4 text-center">
            <i class="fa-solid fa-eye text-white/70 text-xl mb-2"></i>
            <p class="text-white/70">Visibility</p>
            <p id="visibility" class="text-white text-xl font-semibold">-- km</p>
          </div>
        </div>
      </div>

      <!-- Forecast Section -->
      <div class="card-glass p-6 animate-slide-up">
        <h3 class="text-xl font-semibold text-white mb-4">5-Day Forecast</h3>
        <div id="forecast" class="grid grid-cols-2 md:grid-cols-5 gap-3">
          <!-- Forecast items dynamically inserted -->
        </div>
      </div>
    </div>

    <!-- Footer Section -->
    <footer class=" text-center text-white/50 text-sm p-4">
      <p>Powered by OpenWeatherMap</p>
    </footer>
  </main>



  <!-- Script -->
  <script src="script.js"></script>
</body>

</html>
